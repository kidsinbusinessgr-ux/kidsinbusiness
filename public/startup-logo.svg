<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <pattern id="hb" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <polygon points="10,0 20,5 20,15 10,20 0,15 0,5" fill="none" stroke="#80deea" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="180" fill="#81d4e8"/>
  <rect width="400" height="180" fill="url(#hb)" opacity="0.4"/>
  
  <!-- START- -->
  <text x="10" y="82" font-family="Arial Black, sans-serif" font-weight="900" font-size="52" fill="#5c1a1a" letter-spacing="-1">START-</text>
  
  <!-- UP (blue U with orange arrow) -->
  <text x="258" y="82" font-family="Arial Black, sans-serif" font-weight="900" font-size="52" fill="#5ba4d4">U</text>
  <!-- Arrow shape -->
  <polygon points="316,20 336,20 336,50 346,50 326,72 306,50 316,50" fill="#f97316"/>
  <text x="320" y="82" font-family="Arial Black, sans-serif" font-weight="900" font-size="52" fill="#5ba4d4">P</text>
  
  <!-- ADVENTURE multicolor -->
  <text x="10"  y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#f97316">A</text>
  <text x="52"  y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#0f766e">D</text>
  <text x="96"  y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#16a34a">V</text>
  <text x="138" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#db2777">E</text>
  <text x="175" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#1e3a5f">N</text>
  <text x="218" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#7c3aed">T</text>
  <text x="256" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#0f766e">U</text>
  <text x="300" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#16a34a">R</text>
  <text x="341" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="54" fill="#f97316">E</text>
</svg>
